<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Special Audio</title>
  <meta name="description" content="Unofficial desktop companion for the CMF Headphone Pro. Not affiliated with Nothing Technology Ltd.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#EDEDED" media="(prefers-color-scheme: light)">
  <link rel="preload" href="fonts/Doto-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/SpaceMono-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
    <canvas id="grid"></canvas>
  </div>

  <div class="app" data-status="idle">
    <header class="top">
      <div class="brand">
        <span class="status-dot" id="status-dot"></span>
        <span class="label" id="status-text">Not connected</span>
      </div>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Theme: system">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      </button>
    </header>

    <section class="hero" aria-labelledby="device-name">
      <h1 class="device-name dot" id="device-name">No device</h1>
      <div class="gauge" id="gauge">
        <canvas id="hero-canvas"></canvas>
        <div class="gauge-center">
          <div class="pct-row"><span class="pct dot" id="pct"></span><span class="unit dot" id="pct-unit" hidden>%</span></div>
          <span class="label" id="pct-label" aria-live="polite">Offline</span>
        </div>
      </div>
      <div class="connect-row" id="connect-row">
        <button class="pill primary" id="connect-btn" type="button">Connect</button>
        <button class="pill" id="demo-btn" type="button">Demo mode</button>
      </div>
      <div class="connect-row" id="session-row" hidden>
        <button class="pill" id="disconnect-btn" type="button">Disconnect</button>
      </div>
      <p class="hint" id="hint"></p>
    </section>

    <main class="cards">
      <section class="card" id="card-noise" data-feature="anc" aria-labelledby="noise-title">
        <div class="card-head">
          <h2 class="label" id="noise-title">Noise control</h2>
          <span class="lock label" aria-hidden="true"></span>
        </div>
        <div class="segmented" role="radiogroup" aria-labelledby="noise-title" id="noise-seg">
          <span class="seg-thumb" aria-hidden="true"></span>
          <button type="button" role="radio" data-value="anc">ANC</button>
          <button type="button" role="radio" data-value="transparency">Transparency</button>
          <button type="button" role="radio" data-value="off">Off</button>
        </div>
        <div class="levels" id="anc-levels" role="radiogroup" aria-label="Noise cancellation strength">
          <button type="button" role="radio" class="chip small" data-value="high">High</button>
          <button type="button" role="radio" class="chip small" data-value="mid">Mid</button>
          <button type="button" role="radio" class="chip small" data-value="low">Low</button>
          <button type="button" role="radio" class="chip small" data-value="adaptive">Adaptive</button>
        </div>
      </section>

      <section class="card" id="card-spatial" data-feature="spatial" aria-labelledby="spatial-title">
        <div class="card-head">
          <h2 class="label" id="spatial-title">Spatial audio</h2>
          <span class="lock label" aria-hidden="true"></span>
        </div>
        <div class="chips" role="radiogroup" aria-labelledby="spatial-title" id="spatial-chips">
          <button type="button" role="radio" class="chip" data-value="off">Off</button>
          <button type="button" role="radio" class="chip" data-value="cinema">Cinema</button>
          <button type="button" role="radio" class="chip" data-value="concert">Concert</button>
        </div>
      </section>

      <section class="card" id="card-eq" data-feature="eq" aria-labelledby="eq-title">
        <div class="card-head">
          <h2 class="label" id="eq-title">Equaliser</h2>
          <span class="lock label" aria-hidden="true"></span>
        </div>
        <canvas class="eq-canvas" id="eq-canvas" aria-hidden="true"></canvas>
        <div class="chips wrap" role="radiogroup" aria-labelledby="eq-title" id="eq-chips"></div>
      </section>

      <section class="card row" id="card-lowlag" data-feature="lowLag" aria-labelledby="lowlag-title">
        <div>
          <div class="card-head">
            <h2 class="label" id="lowlag-title">Low lag mode</h2>
            <span class="lock label" aria-hidden="true"></span>
          </div>
          <p class="desc">Less audio delay for games and video.</p>
        </div>
        <button type="button" class="switch" role="switch" aria-checked="false" aria-labelledby="lowlag-title" id="lowlag-switch">
          <span class="knob"></span>
        </button>
      </section>
    </main>

    <footer class="foot">
      <div class="foot-row">
        <span class="label">Firmware <span id="fw">--</span></span>
        <button type="button" class="link label" id="dev-btn" aria-expanded="false" aria-controls="devpanel">Developer</button>
      </div>
      <section class="devpanel card" id="devpanel" hidden aria-label="Developer panel">
        <dl class="dev-grid" id="dev-details"></dl>
        <div class="dev-actions" id="demo-actions" hidden>
          <span class="label">Simulate</span>
          <button type="button" class="chip small" data-sim="button">Noise button</button>
          <button type="button" class="chip small" data-sim="low">Battery 12%</button>
          <button type="button" class="chip small" data-sim="charge">Charging</button>
          <button type="button" class="chip small" data-sim="drop">Drop link</button>
        </div>
        <div class="dev-actions">
          <span class="label">Frames</span>
          <button type="button" class="chip small" id="log-copy">Copy</button>
          <button type="button" class="chip small" id="log-clear">Clear</button>
        </div>
        <ol class="log" id="log" aria-live="off"></ol>
      </section>
      <p class="legal">Unofficial. Not affiliated with Nothing Technology Ltd. Use at your own risk.</p>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
