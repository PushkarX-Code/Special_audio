# Builds the desktop app for Windows and macOS.
# - Pull requests: run tests and build installers (downloadable from the run's "Artifacts").
# - "Run workflow" button (Actions tab) or a v* tag: build and publish a GitHub Release.
name: Build app

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  build:
    name: build (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            bundles: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            bundles: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Publish a release only from the button or a tag, never from a pull request.
          tagName: ${{ github.event_name != 'pull_request' && 'v__VERSION__' || '' }}
          releaseName: 'Special Audio v__VERSION__'
          releaseBody: |
            **Easiest install (no security warnings):** see the one-line commands in the [README](https://github.com/PushkarX-Code/Special_audio#install-one-command-no-security-warnings).
            Or download below: Windows → the `x64-setup.exe` file, Mac → the `universal.dmg` file.
            This build runs in Demo mode. The real headphone connection comes in a later release.
          releaseDraft: false
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: special-audio-${{ matrix.platform }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  # Runs the one-command installers on real Windows and Mac machines against the latest release.
  install-scripts:
    name: installer (${{ matrix.platform }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install with the Mac script
        if: runner.os == 'macOS'
        run: |
          bash scripts/install-mac.sh
          test -d "/Applications/Special Audio.app"
          xattr -l "/Applications/Special Audio.app" | grep -q quarantine && { echo "quarantine flag still set"; exit 1; } || true
          osascript -e 'quit app "Special Audio"' || true
      - name: Install with the Windows script
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-Content scripts/install-windows.ps1 -Raw | Invoke-Expression
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Special Audio') -Filter *.exe | Where-Object { $_.Name -notlike 'uninstall*' }
          if (-not $exe) { throw 'app exe not found after install' }
          Write-Host "Installed: $($exe.FullName)"
          Start-Sleep 3
          Get-Process | Where-Object { $_.Path -eq $exe.FullName } | Stop-Process -Force
