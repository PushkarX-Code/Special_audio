# Builds the desktop app for Windows and macOS.
# - Pull requests: run tests and build installers (downloadable from the run's "Artifacts").
# - "Run workflow" button (Actions tab) or a v* tag: build and publish a GitHub Release.
name: Build app

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  build:
    name: build (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            stable_src: src-tauri/target/release/bundle/nsis/*-setup.exe
            stable_name: Special-Audio-windows-setup.exe
            bundles: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            stable_src: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            stable_name: Special-Audio-mac.dmg
            bundles: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # What's new in this version (RELEASE_NOTES.md). The app shows it on its update screen.
      - id: notes
        shell: bash
        run: |
          { echo 'body<<EOF_NOTES'; cat RELEASE_NOTES.md; echo 'EOF_NOTES'; } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the in-app updates (not an Apple/Microsoft certificate). Set once in repo Settings → Secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          args: ${{ matrix.args }}
          # Publish a release only from the button or a tag, never from a pull request.
          tagName: ${{ github.event_name != 'pull_request' && 'v__VERSION__' || '' }}
          releaseName: 'Special Audio v__VERSION__'
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            ---
            **How to install:** follow the [Download](https://github.com/PushkarX-Code/Special_audio#download) steps in the README.
            Windows → `Special-Audio-windows-setup.exe`. Mac → `Special-Audio-mac.dmg`.
            The first time, your computer warns that the app is from an unknown developer. The README shows what to click, or how to install with one command and skip the warning.
            Already installed? The app updates itself: open the Update tab.
          releaseDraft: false
          prerelease: false

      # Same installer under a fixed name, so the README can link to the newest one directly:
      # https://github.com/<repo>/releases/latest/download/<stable_name>
      - name: Add fixed-name download to the release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp ${{ matrix.stable_src }} "${{ matrix.stable_name }}"
          gh release upload "v$VERSION" "${{ matrix.stable_name }}" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: special-audio-${{ matrix.platform }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  # Runs the one-command installers on real Windows and Mac machines against the latest release.
  install-scripts:
    name: installer (${{ matrix.platform }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install with the Mac script
        if: runner.os == 'macOS'
        run: |
          bash scripts/install-mac.sh
          test -d "/Applications/Special Audio.app"
          xattr -l "/Applications/Special Audio.app" | grep -q quarantine && { echo "quarantine flag still set"; exit 1; } || true
          osascript -e 'quit app "Special Audio"' || true
      - name: Install with the Windows script
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-Content scripts/install-windows.ps1 -Raw | Invoke-Expression
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Special Audio') -Filter *.exe | Where-Object { $_.Name -notlike 'uninstall*' }
          if (-not $exe) { throw 'app exe not found after install' }
          Write-Host "Installed: $($exe.FullName)"
          Start-Sleep 3
          Get-Process | Where-Object { $_.Path -eq $exe.FullName } | Stop-Process -Force
