# Builds the desktop app for Windows and macOS.
# - Pull requests: run tests and build installers (downloadable from the run's "Artifacts").
# - "Run workflow" button (Actions tab) or a v* tag: build and publish a GitHub Release.
name: Build app

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  build:
    name: build (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            bundles: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            bundles: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Publish a release only from the button or a tag, never from a pull request.
          tagName: ${{ github.event_name != 'pull_request' && 'v__VERSION__' || '' }}
          releaseName: 'Special Audio v__VERSION__'
          releaseBody: |
            **Download:** Windows → the `.exe` file. Mac → the `.dmg` file.
            This build runs in Demo mode. The real headphone connection comes in the next release.
            Not signed yet: see the README "Install" section for the one-time security prompt.
          releaseDraft: false
          prerelease: true

      - uses: actions/upload-artifact@v4
        with:
          name: special-audio-${{ matrix.platform }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
