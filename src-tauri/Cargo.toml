[package]
name = "special-audio"
version = "0.1.2"
description = "Unofficial desktop companion for the CMF Headphone Pro"
authors = ["Pushkar Choudhury"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "special_audio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
